[package]
name = "snake-online"
version = "0.1.0"
edition = "2024"

[lib]
name = "snake"
path = "src/lib.rs"

[[bin]]
name = "snake-online"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
bytes = "1"
prost = "0.14.6"
tachyonfx = "0.25.2"

[build-dependencies]
prost-build = "0.14.6"
